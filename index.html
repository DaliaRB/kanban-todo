<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Mon tableau Kanban : créer, suivre et trier ses tâches en To do, In Progress et Done, enregistrées dans le navigateur.">
    <!-- CSP : seulement nos fichiers ('self'), script uniquement index.js -> un script injecté est bloqué (XSS) -->
    <meta http-equiv="Content-Security-Policy" content="
          default-src 'self';
          script-src 'self';
          style-src 'self';
          img-src 'self';
          font-src 'self';
          form-action 'self';
          base-uri 'self';
          object-src 'none'">
    <!-- referrer : les autres sites voient juste le nom du site, pas l'url complète -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon.png" type="image/png">
    <title>My Kanban Board</title>
</head>
<body>

<header>
    <nav>
        <!-- recherche, filtre et tri (comme la correction) -->
        <input id="searchInput" type="search" placeholder="🔍 Rechercher..." aria-label="Rechercher une tâche">
        <select id="priorityFilter" aria-label="Filtrer par priorité">
            <option value="all">Toutes priorités</option>
            <option value="low">🟢 Low</option>
            <option value="medium">🟡 Moyen</option>
            <option value="high">🔴 High</option>
        </select>
        <select id="sortSelect" aria-label="Trier">
            <option value="createdDesc">Tri : récentes</option>
            <option value="createdAsc">Tri : anciennes</option>
            <option value="dueAsc">Tri : deadline ↑</option>
            <option value="dueDesc">Tri : deadline ↓</option>
        </select>
    </nav>
    <h1> 𓇼🪼｡𖦹°🫧My very own board𓆉 𓆝 𓆡⋆.˚  </h1>
    <p>Discipline is the bridge between goals and accomplishment</p>
</header>

<main>
    <!-- même formulaire pour créer et modifier une tâche -->
    <form class="card" id="taskForm">
        <h2 id="formTitle" class="form-title">Créer une tâche</h2>
        <input id="titleInput" type="text" placeholder="Title" aria-label="Titre" maxlength="60">
        <input id="descInput" type="text" placeholder="Description" aria-label="Description" maxlength="200">
        <select id="priorityInput" aria-label="Priorité" required>
            <option value="">Priorité</option>
            <option value="low">🟢 Low</option>
            <option value="medium">🟡 Moyen</option>
            <option value="high">🔴 High</option>
        </select>
        <!-- type date = calendrier du navigateur -->
        <input id="dueInput" type="date" aria-label="Date limite">
        <!-- role alert : le lecteur d'écran lit l'erreur -->
        <p id="formError" class="form-error" role="alert"></p>
        <button id="submitBtn" type="submit">+ Add task</button>
        <button id="cancelBtn" type="button" class="hidden">Annuler</button>
    </form>

    <!-- les 3 colonnes, les cartes sont ajoutées en js dans col-body -->
    <div class="kanban">
        <section class="column" data-status="todo">
            <h2>𓇼 ⋆.˚ 𓆉 𓆝 To do 𓆡⋆.˚ 𓇼</h2>
            <p class="count-line"><span class="count" id="countTodo">0</span> tâche(s)</p>
            <div class="col-body" id="colTodo"></div>
            <p class="empty hidden" id="emptyTodo">Aucune tâche</p>
        </section>
        <section class="column" data-status="doing">
            <h2>⊹ ﹏𓊝﹏𓂁﹏⊹ In Progress 𓇼</h2>
            <p class="count-line"><span class="count" id="countDoing">0</span> tâche(s)</p>
            <div class="col-body" id="colDoing"></div>
            <p class="empty hidden" id="emptyDoing">Aucune tâche</p>
        </section>
        <section class="column" data-status="done">
            <h2>˚˖𓍢ִ໋ ✧˚.⋆ Done 🫧𓆉 𓆝</h2>
            <p class="count-line"><span class="count" id="countDone">0</span> tâche(s)</p>
            <div class="col-body" id="colDone"></div>
            <p class="empty hidden" id="emptyDone">Aucune tâche</p>
        </section>
    </div>
</main>

<footer>
    <p> .˚ 𓇼  𓆉 𓆝 My Own board © 2026 .˚ 𓇼 </p>
</footer>

<script src="index.js"></script>
</body>
</html>
